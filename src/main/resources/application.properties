spring.application.name=wallet-service

# Local PostgreSQL (psql -U ashishranjan -d ashishranjan)
spring.datasource.url=jdbc:postgresql://localhost:5432/walletdb
spring.datasource.username=ashishranjan
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

wallet.default-max-balance=100000.00

logging.level.com.wallet=DEBUG
logging.level.org.hibernate.SQL=DEBUG
